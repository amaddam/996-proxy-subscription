name: Update subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'convert.py'
      - 'wrangler.jsonc'
      - '.github/workflows/update.yml'

permissions:
  contents: read

concurrency:
  group: subscription-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependency
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Build subscriptions
        env:
          CLASH_SUB_URL: ${{ secrets.CLASH_SUB_URL }}
          OTHER_SUB_URL: ${{ secrets.OTHER_SUB_URL }}
        run: python convert.py
      - name: Deploy static assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
